name: Daily catalog sync
on:
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC = 7am PDT / 6am PST
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: catalog-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source repo (public)
        run: git clone --depth 1 https://github.com/poojithmalla8/movie-watchlist.git /tmp/source
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Merge, enrich, dedupe
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}   # optional; empty if the secret is not set
        run: python scripts/sync_catalog.py /tmp/source
      - name: Streaming availability (~1/7 of titles per day)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}   # optional fallback if JustWatch is unavailable
        run: python scripts/streaming.py
      - name: Trailers (new/missing titles, verified via YouTube oEmbed)
        run: python scripts/trailers.py
        continue-on-error: true
      - name: Poster texture atlases for the 3D store (only new titles are downloaded)
        run: pip install --quiet pillow && python scripts/atlas.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json features.json services.json streaming/ scripts/ atlas/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily catalog sync from movie-watchlist"
          git push
